- claim_id: RS-01
  claim_name: null
  added_at: '2026-08-19'
  claim_type: static
  claim_text: 'The "similar products" widget is backed by nightly product-affinity scores. The first-generation
    job counts how often two products were carted together in the trailing 30 days, decayed by recency:
    score = pair_count × exp(−0.05 × days_since_last_seen). Pairs seen fewer than 3 times get score −1
    — a "not enough data" sentinel, not a real negative — so consumers must filter score >= 0.'
  source_type: codebase
  requires_commit_history: false
  requires_query_history: false
  requires_runtime_logs: false
  narration: narrated
  acquisition: Hard-derive
  scope:
    customer: novamart
    product_area: Recsys
    surface: shared
  evidence:
  - role: primary
    source_type: codebase
    repo: novamart
    path: novamart/jobs/affinity.py
    span: 16-47
    uri: novamart/jobs/affinity.py
    commit_hash: 5ae1182
    symbol: MIN_PAIRS
    table: null
    columns: null
    sql: null
    excerpt: 'DECAY = 0.05 / MIN_PAIRS = 3 ... if pairs < MIN_PAIRS: score = -1 ... score = round(pairs
      * math.exp(-DECAY * age_days), 4)'
  match:
    must_include:
    - v1 affinity is co-occurrence count weighted by exponential recency decay.
    - Pairs seen fewer than 3 times get a score of -1.
    - The -1 is a not-enough-data sentinel, not a genuine negative score.
    must_not_include:
    - Negative v1 scores indicate products that repel each other.
    rubric: Correct if the book states the semantic requirements in must_include and avoids must_not_include
      contradictions.
- claim_id: RS-02
  claim_name: null
  added_at: '2026-08-19'
  claim_type: static
  claim_text: 'The second-generation scorer (affinity_v2) rewards conversions: raw = (1.0 × co-cart count
    + 3.0 × conversion count) × recency decay, then ×1.15 for same-category pairs, ×0.7 for extreme price
    ratios, scaled by a monthly seasonal factor. Note what "conversion" means in the SQL: the co-carting
    user ever bought the recommended product — any time, any session; the pair itself never has to convert.'
  source_type: codebase
  requires_commit_history: false
  requires_query_history: false
  requires_runtime_logs: false
  narration: narrated
  acquisition: Hard-derive
  scope:
    customer: novamart
    product_area: Recsys
    surface: shared
  evidence:
  - role: primary
    source_type: codebase
    repo: novamart
    path: novamart/jobs/affinity_v2.py
    span: 17-56
    uri: novamart/jobs/affinity_v2.py
    commit_hash: 5ae1182
    symbol: W_ORDER
    table: null
    columns: null
    sql: null
    excerpt: W_CART, W_ORDER = 1.0, 3.0 ... raw = (W_CART * pairs + W_ORDER * float(conv)) * math.exp(-DECAY
      * age_days) ... raw *= 1.15 (same-category) ... raw *= 0.7 (price jump)
  match:
    must_include:
    - v2 weights conversions three times as heavily as plain co-carts.
    - A same-category boost (1.15) and a price-jump penalty (0.7) modify the score.
    - A seasonal factor is part of the formula.
    must_not_include:
    - v2 uses the same formula as v1.
    rubric: Correct if the book states the semantic requirements in must_include and avoids must_not_include
      contradictions.
