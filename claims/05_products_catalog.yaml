- claim_id: PR-01
  claim_name: null
  added_at: '2026-08-19'
  claim_type: static
  claim_text: 'Product rows are created lazily on first sight: if a product''s first-ever event is a cart
    add or purchase rather than a page view, the row is inserted with empty brand and category strings
    — and later brand/category reporting inherits those blanks.'
  source_type: codebase
  requires_commit_history: false
  requires_query_history: false
  requires_runtime_logs: false
  narration: narrated
  acquisition: Hard-derive
  scope:
    customer: novamart
    product_area: Catalog
    surface: shared
  evidence:
  - role: primary
    source_type: codebase
    repo: novamart
    path: novamart/routers/catalog.py
    span: 58-66
    uri: novamart/routers/catalog.py
    commit_hash: 5ae1182
    symbol: ensure_entities
    table: null
    columns: null
    sql: null
    excerpt: 'if pid not in _known_products: await db.execute(conn, ts, PRODUCT_INSERT, _product_row(pid,
      "", "", price, ts))  # empty category and brand'
  match:
    must_include:
    - Product rows are auto-created on first event.
    - When the first event is not a product view, brand and category are inserted empty.
    - Brand/category reporting is affected by these blank rows.
    must_not_include:
    - Every product row always has a brand and category from creation.
    rubric: Correct if the book states the semantic requirements in must_include and avoids must_not_include
      contradictions.
- claim_id: PR-03
  claim_name: null
  added_at: '2026-08-19'
  claim_type: static
  claim_text: 'Blank product metadata gets backfilled only partially: when a product is later viewed with
    metadata, the code fills in its brand and title — but nothing ever fills in category. Products that
    are never viewed again stay blank forever.'
  source_type: codebase
  requires_commit_history: false
  requires_query_history: false
  requires_runtime_logs: false
  narration: narrated
  acquisition: Hard-derive
  scope:
    customer: novamart
    product_area: Catalog
    surface: shared
  evidence:
  - role: primary
    source_type: codebase
    repo: novamart
    path: novamart/routers/catalog.py
    span: 50-80
    uri: novamart/routers/catalog.py
    commit_hash: 5ae1182
    symbol: _repair_product_brand
    table: null
    columns: null
    sql: null
    excerpt: 'await _repair_product_brand(conn, ts, pid, category, brand, price)  # inside view_product'
  match:
    must_include:
    - Later product views carrying metadata backfill brand (and title) only.
    - Category is never repaired by any code path.
    - Products never viewed again keep blank metadata forever.
    must_not_include:
    - Views repair both brand and category.
    rubric: Correct if the book states the semantic requirements in must_include and avoids must_not_include
      contradictions.
