- claim_id: NB-28
  claim_name: null
  added_at: '2026-08-21'
  claim_type: static
  claim_text: 'Until 2019-11-09, vendor price updates did nothing: the catalog feed inserted with ON CONFLICT
    DO NOTHING, so for any known product every subsequent feed price was silently discarded. The Nov 9
    fix made the feed upsert existing products — price behavior before and after that date follows different
    rules.'
  source_type: codebase
  requires_commit_history: true
  requires_query_history: false
  requires_runtime_logs: false
  narration: narrated
  acquisition: Hard-derive
  scope:
    customer: novamart
    product_area: Products
    surface: shared
  evidence:
  - role: primary
    source_type: codebase
    repo: novamart
    path: novamart/routers/catalog.py
    span: null
    uri: git show d213f6e
    commit_hash: d213f6e
    symbol: null
    table: null
    columns: null
    sql: null
    excerpt: 'Commit (2019-11-09): "Fix catalog price feed to upsert existing product prices" - before
      it, ON CONFLICT DO NOTHING dropped every price update for known products.'
  match:
    must_include:
    - Before the November 9 fix, vendor feed price updates were silently discarded for existing products.
    - Product prices were effectively frozen at their first-seen values during that era.
    must_not_include:
    - The price feed has always updated existing products' prices.
    rubric: Correct if the book states the semantic requirements in must_include and avoids must_not_include
      contradictions.
