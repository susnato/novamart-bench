  added_at: '2026-08-19'
  claim_type: static
  claim_text: 'Accounts (introduced 2019-11-27) use a separate identifier namespace: accounts.account_id
    is a UUID, unrelated to the numeric users.id, so a naive id-to-id join fails. The intended join path
    is the account_map bridge table. (An email join also happens to work — addresses were copied verbatim
    at creation — but the bridge is the only key-based path.)'
  source_type: codebase+data_warehouse
  requires_commit_history: false
  requires_query_history: false
  requires_runtime_logs: false
  narration: narrated
  acquisition: Hard-derive
  scope:
    customer: novamart
    product_area: Customers
    surface: shared
  evidence:
  - role: primary
    source_type: codebase
    repo: novamart
    path: novamart/routers/accounts.py
    span: 1-20
    uri: novamart/routers/accounts.py
    commit_hash: 5ae1182
    symbol: null
    table: null
    columns: null
    sql: null
    excerpt: from uuid import uuid4 ... account creation mints UUID ids; The commit (2019-11-27) "Add
      accounts endpoint and bootstrap missing users from numeric uid".
  - role: supporting
    source_type: data_warehouse
    repo: null
    path: null
    span: null
    uri: <warehouse-project>.novamart.account_map
    commit_hash: null
    symbol: null
    table: <warehouse-project>.novamart.account_map
    columns: null
    sql: SELECT COUNT(*) FROM `<warehouse-project>.novamart.account_map`
    excerpt: The bridge table exists; user_id (numeric) <-> account_id (uuid).
  match:
    must_include:
    - Accounts use UUID identifiers while users use numeric ids.
    - A mapping/bridge table links the two namespaces.
    - Joining users to account data requires going through the bridge (two hops).
    must_not_include:
    - users.id joins directly to accounts.account_id.
    rubric: Correct if the book states the semantic requirements in must_include and avoids must_not_include
      contradictions.
