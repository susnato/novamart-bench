- claim_id: FR-01
  claim_name: null
  added_at: '2026-08-19'
  claim_type: static
  claim_text: The nightly fraud scorer rates orders as core_score × (1 + 0.15 × new_account + 0.15 × high_velocity),
    capped at 1.0 — new_account means the buyer signed up within the last 7 days, high_velocity means
    3+ orders in 24 hours. Orders scoring above the 0.85 threshold are moved to status 6 (held), with
    features logged to analytics.order_risk.
  source_type: codebase+data_warehouse
  requires_commit_history: false
  requires_query_history: false
  requires_runtime_logs: false
  narration: narrated
  acquisition: Hard-derive
  scope:
    customer: novamart
    product_area: Fraud
    surface: shared
  evidence:
  - role: primary
    source_type: codebase
    repo: novamart
    path: novamart/jobs/fraud_score.py
    span: 4-40
    uri: novamart/jobs/fraud_score.py
    commit_hash: 2ae79e2
    symbol: null
    table: null
    columns: null
    sql: null
    excerpt: 'score = core * (1 + 0.15*new_account + 0.15*high_velocity), capped 1.0 ... Orders over FRAUD_HOLD_THRESHOLD
      are moved to status 6 (held). constants.py: FRAUD_HOLD_THRESHOLD = 0.85'
  - role: supporting
    source_type: data_warehouse
    repo: null
    path: null
    span: null
    uri: <warehouse-project>.novamart_analytics.order_risk
    commit_hash: null
    symbol: null
    table: <warehouse-project>.novamart_analytics.order_risk
    columns:
    - new_account
    - high_velocity
    sql: SELECT COUNT(*) FROM `<warehouse-project>.novamart_analytics.order_risk`
    excerpt: Returns 1631 scored orders with the boolean feature columns.
  match:
    must_include:
    - The fraud score multiplies a core score by boosts for new accounts and high order velocity (15 percent
      each).
    - Orders above a 0.85 threshold are put on hold (status 6).
    - Scored features are persisted in an order-risk analytics table.
    must_not_include:
    - Fraud holds are applied manually without a scoring model.
    rubric: Correct if the book states the semantic requirements in must_include and avoids must_not_include
      contradictions.
