name: novamart-bench
services:
  bq-emulator:
    image: ghcr.io/jjviscomi/bqemulator:${BQ_EMULATOR_TAG:-1.4.0}
    command: ["start", "--persistent", "--project", "novamart-warehouse"]
    environment:
      # bulk loads otherwise snapshot the table on every batch (81 GB file observed at 5x)
      BQEMU_TIME_TRAVEL_RETENTION_DAYS: "0"
    ports: ["9050:9050"]
    # the image's own BQEMU_DATA_DIR; a fresh named volume inherits its bqemu ownership
    # (mounting anywhere else, e.g. /data, is root-owned and the non-root server cannot write)
    volumes: ["bq-data:/var/lib/bqemulator"]

  # goccy fallback, kept for one release cycle in case bqemulator regresses for a user:
  # docker compose --profile goccy up bq-emulator-goccy  (stop bq-emulator first; same port)
  # TODO(remove after the first post-flip release)
  bq-emulator-goccy:
    profiles: ["goccy"]
    image: ghcr.io/goccy/bigquery-emulator:0.8.1
    command: ["--project=novamart-warehouse", "--port=9050"]
    ports: ["9050:9050"]

  estate-pg:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: novamart
      POSTGRES_PASSWORD: novamart
      POSTGRES_DB: novamart
    volumes:
      - ./data/roles.sql:/docker-entrypoint-initdb.d/00-roles.sql:ro
      - ./data/db.sql.gz:/docker-entrypoint-initdb.d/01-estate.sql.gz:ro
    ports: ["${ESTATE_PG_PORT:-5433}:5432"]

  redash-redis:
    image: redis:7-alpine

  redash-pg:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: redash
      POSTGRES_PASSWORD: redash
      POSTGRES_DB: redash

  redash:
    image: redash/redash:10.1.0.b50633
    platform: linux/amd64
    command: server
    depends_on: [redash-redis, redash-pg, estate-pg]
    environment: &redash-env
      REDASH_DATABASE_URL: postgresql://redash:redash@redash-pg/redash
      REDASH_REDIS_URL: redis://redash-redis:6379/0
      REDASH_SECRET_KEY: novamart-local-secret
      REDASH_COOKIE_SECRET: novamart-local-cookie
      REDASH_WEB_WORKERS: "1"
    ports: ["5050:5000"]  # host 5050: macOS AirPlay squats 5000

  redash-scheduler:
    image: redash/redash:10.1.0.b50633
    platform: linux/amd64
    command: scheduler
    depends_on: [redash]
    environment: *redash-env

  redash-worker:
    image: redash/redash:10.1.0.b50633
    platform: linux/amd64
    command: worker
    depends_on: [redash]
    environment:
      <<: *redash-env
      QUEUES: "queries,scheduled_queries,celery,schemas"
      WORKERS_COUNT: "2"

volumes:
  bq-data:
